# ----------
# Keybinds
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# ----------

$mainMod = SUPER
$ss = SUPER_SHIFT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# or https://github.com/xkbcommon/libxkbcommon/blob/master/include/xkbcommon/xkbcommon-keysyms.h
# code:36 = return/enter key

# Applications
bind = $mainMod, code:36, exec, kitty
bind = $mainMod, B, exec, google-chrome-stable

# Rofi menus
bind = $mainMod, A, exec, ~/.config/rofi/launcher/launcher.sh
bind = $mainMod, W, exec, ~/.config/rofi/wallpapers/wallpapers.sh

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Screenshots
bind = $mainMod, S, exec, ~/.config/hypr/scripts/screenshot
bind = , Print, exec, ~/.config/hypr/scripts/screenshot_full

# Window management
bind = $mainMod, Q, killactive, 
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating, 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move and resize floating window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move active window around current workspace
bind = $ss Control, left, movewindow, l
bind = $ss Control, right, movewindow, r
bind = $ss Control, up, movewindow, u
bind = $ss Control, down, movewindow, d

# Resize active window
bind = $ss, left, resizeactive, -30 0
bind = $ss, right, resizeactive, 30 0
bind = $ss, up, resizeactive, 0 -30
bind= $ss, down, resizeactive, 0 30

# Switch workspaces
bind = $mainMod Control, Right, workspace, r+1
bind = $mainMod Control, Left, workspace, r-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod Control+Alt, Right, movetoworkspace, r+1
bind = $mainMod Control+Alt, Left, movetoworkspace, r-1
bind = $ss, 1, movetoworkspace, 1
bind = $ss, 2, movetoworkspace, 2
bind = $ss, 3, movetoworkspace, 3
bind = $ss, 4, movetoworkspace, 4
bind = $ss, 5, movetoworkspace, 5
bind = $ss, 6, movetoworkspace, 6
bind = $ss, 7, movetoworkspace, 7
bind = $ss, 8, movetoworkspace, 8
bind = $ss, 9, movetoworkspace, 9
bind = $ss, 0, movetoworkspace, 10
